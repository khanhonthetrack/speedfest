# Render.com blueprint: one free web service that serves the web build (server/public) and the
# online rooms (WebSocket /ws). See docs/HOSTING.md "Deploy to Render".
services:
  - type: web
    name: speedfest
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
