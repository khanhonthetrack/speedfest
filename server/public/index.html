<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>SpeedFest</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #e8f4ff;
	background: #070b1a;
	overflow: hidden;
	touch-action: none;
	font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 28px;
	visibility: hidden;
	background:
		radial-gradient(ellipse at 50% 120%, rgba(255, 43, 214, 0.35), transparent 60%),
		radial-gradient(ellipse at 50% -20%, rgba(0, 229, 255, 0.25), transparent 55%),
		linear-gradient(180deg, #070b1a 0%, #0d1030 100%);
}

#status::after {
	/* wet-asphalt horizon lines */
	content: "";
	position: absolute;
	left: 0;
	right: 0;
	bottom: 0;
	height: 38%;
	background: repeating-linear-gradient(180deg, rgba(0, 229, 255, 0.07) 0 2px, transparent 2px 22px);
	transform: perspective(400px) rotateX(55deg);
	transform-origin: bottom;
	pointer-events: none;
}

#logo {
	font-family: 'Arial Black', 'Segoe UI Black', Impact, sans-serif;
	font-style: italic;
	font-weight: 900;
	font-size: clamp(48px, 9vw, 120px);
	letter-spacing: 0.06em;
	transform: skewX(-12deg);
	background: linear-gradient(90deg, #00e5ff, #ffffff 45%, #ff2bd6);
	-webkit-background-clip: text;
	background-clip: text;
	color: transparent;
	filter: drop-shadow(0 0 18px rgba(0, 229, 255, 0.6)) drop-shadow(0 0 40px rgba(255, 43, 214, 0.35));
	animation: flicker 4s infinite;
	z-index: 1;
}

@keyframes flicker {
	0%, 92%, 100% { opacity: 1; }
	93% { opacity: 0.6; }
	94% { opacity: 1; }
	96% { opacity: 0.75; }
}

#bar {
	width: min(520px, 70vw);
	height: 10px;
	border: 1px solid rgba(0, 229, 255, 0.6);
	transform: skewX(-20deg);
	background: rgba(0, 229, 255, 0.08);
	box-shadow: 0 0 16px rgba(0, 229, 255, 0.35);
	z-index: 1;
}

#bar-fill {
	height: 100%;
	width: 0%;
	background: linear-gradient(90deg, #00e5ff, #ff2bd6);
	box-shadow: 0 0 14px #ff2bd6;
	transition: width 0.2s;
}

#bar.indeterminate #bar-fill {
	width: 30%;
	animation: slide 1.2s infinite linear;
}

@keyframes slide {
	from { margin-left: -30%; }
	to { margin-left: 100%; }
}

#tip {
	font-size: 15px;
	letter-spacing: 0.08em;
	text-transform: uppercase;
	color: #9fb4d8;
	z-index: 1;
	text-align: center;
	padding: 0 16px;
}

#tip b {
	color: #ffb300;
}

#status-notice {
	display: none;
	background-color: rgba(91, 25, 60, 0.9);
	border: 1px solid #ff2bd6;
	color: #ffe6f6;
	line-height: 1.4;
	margin: 0 2rem;
	padding: 1rem 1.5rem;
	text-align: center;
	z-index: 1;
	max-width: 640px;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			SpeedFest needs JavaScript and WebGL 2.
		</noscript>

		<div id="status">
			<div id="logo">SPEEDFEST</div>
			<div id="bar" class="indeterminate"><div id="bar-fill"></div></div>
			<div id="tip"></div>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":2956464,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const bar = document.getElementById('bar');
	const barFill = document.getElementById('bar-fill');
	const statusNotice = document.getElementById('status-notice');
	const tipEl = document.getElementById('tip');

	const tips = [
		'<b>Backspace</b> respawns you at the last checkpoint',
		'<b>Delete</b> or <b>Enter</b> restarts the run instantly',
		'<b>Shift</b> fires nitrous, and drifting refills it',
		'<b>Space</b> is the handbrake: flick it to drift',
		'<b>C</b> switches camera, <b>Tab</b> shows the leaderboard',
		'Tune your ride in the <b>Garage</b> before the round starts',
	];
	tipEl.innerHTML = tips[Math.floor(Math.random() * tips.length)];

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		bar.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		text.split('\n').forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	// Test/automation hook: ?arg=--key=value&arg=--other passes user args to the game
	// (read in Godot via TestHooks.arg). Normal players never need this.
	const userArgs = new URLSearchParams(window.location.search).getAll('arg').filter((a) => a.startsWith('--'));

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		const missingMsg = 'Your browser is missing features SpeedFest needs (use a recent desktop Chrome, Edge or Firefox):\n';
		displayFailureNotice(missingMsg + missing.join('\n'));
	} else {
		setStatusMode('progress');
		const startConfig = {
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					bar.classList.remove('indeterminate');
					barFill.style.width = (100 * current / total).toFixed(1) + '%';
				} else {
					bar.classList.add('indeterminate');
				}
			},
		};
		if (userArgs.length > 0) {
			startConfig['args'] = ['--'].concat(userArgs);
		}
		engine.startGame(startConfig).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
